<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Visa Blog — метрики и путь</title><style>:root{--bg:#F4F7F9;--surface:#FFF;--ink:#324F5C;--muted:#64748B;--sky:#5AAAE5;--dark:#1D3844;--dark-mid:#2E485F;--radius:20px;--display:'Playfair Display',Georgia,serif;--body:Manrope,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body)}main{max-width:960px;margin:auto;padding:48px 24px}h1,h2{font-family:var(--display);line-height:1.2}.panel{padding:28px;border-radius:var(--radius);background:linear-gradient(90deg,var(--dark),var(--dark-mid),var(--dark));color:var(--surface)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center}.metric b{font-size:48px;color:var(--sky);display:block}.metric span{color:var(--surface)}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.step{background:var(--surface);border-radius:var(--radius);padding:18px}.step b{color:var(--sky);font-size:28px;display:block}@media(max-width:640px){.metrics,.route{grid-template-columns:1fr}}</style></head><body><main><h1>BlogMetrics и BlogRoute</h1><p>Две визуализации, допустимые внутри статьи: результаты и путь клиента. Не используем декоративные графики без данных.</p><section class="panel"><h2>BlogMetrics</h2><div class="metrics"><div class="metric"><b>87%</b><span>успешных одобрений</span></div><div class="metric"><b>12</b><span>стран клиентов</span></div><div class="metric"><b>300+</b><span>благодарных отзывов</span></div></div></section><h2>BlogRoute</h2><section class="route"><div class="step"><b>01</b>Анализ кейса</div><div class="step"><b>02</b>Документы</div><div class="step"><b>03</b>Интервью</div><div class="step"><b>04</b>Решение</div></section></main></body></html>
