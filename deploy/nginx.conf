server {
    listen 80;
    server_name _;

    root /srv/safevisa/current;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite builds a single-page application. This fallback lets direct requests
    # to /usa-safecase, /mini1 and future client-side routes load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
