server {
    listen 80;
    server_name _;

    root /srv/safevisa/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite добавляет хеш к именам JS/CSS: после выпуска новые файлы получают новые имена.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Прямые запросы к маршрутам приложения открывают index.html.
    # HTML перепроверяется, чтобы ссылки в нём вели на актуальные файлы сборки.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
